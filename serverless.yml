org: ashishmak

service: aws-api

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::aws-user-avatar-ashmakk/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - arn:aws:sqs:ap-south-1:${aws:accountId}:avatar-processing-dev
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/ProfileCache
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${aws:region}:${aws:accountId}:secret:aws-serverless-project/dev*

  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    DB_NAME: ${env:DB_NAME}
    JWT_EXP: ${env:JWT_EXP}
    AVATAR_BUCKET: ${env:AVATAR_BUCKET}
    CLOUDFRONT_URL: ${env:CLOUDFRONT_URL}
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL}
    PROFILE_CACHE_TABLE: ${env:PROFILE_CACHE_TABLE}
    STORAGE_PROVIDER: ${env:STORAGE_PROVIDER}
    AVATAR_MAX_SIZE_MB: ${env:AVATAR_MAX_SIZE_MB}
    AVATAR_ALLOWED_TYPES: ${env:AVATAR_ALLOWED_TYPES}
    SECRET_NAME: aws-serverless-project/dev

layers:
  sharp:
    path: layer
    compatibleRuntimes:
      - nodejs22.x

functions:
  imageResize:
    handler: src/functions/imageResizeHandler.handler
    layers:
      - { Ref: SharpLambdaLayer }
    events:
      - sqs:
          arn: arn:aws:sqs:ap-south-1:${aws:accountId}:avatar-processing-dev
          batchSize: 1

  apiLambda:
    handler: src/api/handler.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
      - httpApi:
          path: /auth/login
          method: post
      - httpApi:
          path: /admin/stats
          method: get
      - httpApi:
          path: /admin/profile/{userId}
          method: put
      - httpApi:
          path: /user/profile
          method: get
      - httpApi:
          path: /user/profile
          method: put
      - httpApi:
          path: /user/profile
          method: delete
      - httpApi:
          path: /user/avatar/upload-url
          method: post
      - httpApi:
          path: /user/deactivate
          method: post

plugins:
  - serverless-offline
