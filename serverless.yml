# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ashishmak

# "service" is the name of this project. This will also be added to your AWS resource names.
service: aws-api

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    DB_NAME: ${env:DB_NAME}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXP: ${env:JWT_EXP}

functions:
  apiLambda:
    handler: src/api/handler.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
      - httpApi:
          path: /auth/login
          method: post
      - httpApi:
          path: /admin/stats
          method: get
      - httpApi:
          path: /user/profile
          method: get
      - httpApi:
          path: /user/profile
          method: put
      - httpApi:
          path: /user/profile
          method: delete

plugins:
  - serverless-dotenv-plugin
